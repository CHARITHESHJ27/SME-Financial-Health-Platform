name: ML Pipeline CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "email-validator>=2.0.0" pytest pytest-asyncio httpx

      - name: Generate Training Dataset
        run: |
          PYTHONPATH=. python -m ml.data.generate_dataset --samples 6000 --output-dir data

      - name: Train & Validate Risk Model
        run: |
          PYTHONPATH=. python -m ml.training.train_risk --config configs/risk.yaml

      - name: Train & Validate Multi-Label Recommendation Model
        run: |
          PYTHONPATH=. python -m ml.training.train_recommendation --config configs/recommendation.yaml

      - name: Run Unit, Integration & ML Regression Gates
        run: |
          PYTHONPATH=.:backend pytest tests/ -v --durations=10

      - name: Run Platform Smoke Test
        run: |
          PYTHONPATH=.:backend python test_platform.py

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Test Frontend Build
        working-directory: frontend
        run: npm run build
