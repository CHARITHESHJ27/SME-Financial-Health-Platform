services:

  # ── PostgreSQL (production) ──────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: finexri_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-finexri_prod}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-finexri_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [finexri_net]
    deploy:
      resources:
        limits:   { cpus: "1.0", memory: 512M }
        reservations: { memory: 256M }

  # ── Redis (session cache) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finexri_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [finexri_net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # ── Backend (FastAPI) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: finexri-backend:${VERSION:-latest}
    container_name: finexri_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      ENVIRONMENT:   production
      DATABASE_URL:  postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finexri_prod}
      REDIS_URL:     redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [finexri_net]
    deploy:
      resources:
        limits:   { cpus: "1.0", memory: 512M }
        reservations: { memory: 256M }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Frontend (React + Nginx) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api/v1}
    image: finexri-frontend:${VERSION:-latest}
    container_name: finexri_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks: [finexri_net]
    volumes:
      - ./ssl:/etc/nginx/ssl:ro        # mount SSL certs for HTTPS
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # ── DB backup (runs daily) ───────────────────────────────────
  backup:
    image: postgres:15-alpine
    container_name: finexri_backup
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-finexri_prod}
      POSTGRES_HOST:     postgres
    volumes:
      - ./backups:/backups
      - ./scripts/backup_db.sh:/backup_db.sh:ro
    entrypoint: >
      sh -c "while true; do sleep 86400; sh /backup_db.sh; done"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [finexri_net]

networks:
  finexri_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
